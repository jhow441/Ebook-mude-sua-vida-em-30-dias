<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<title>Projeto 30 Dias — Organize sua Vida</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0B0D;--bg2:#13171C;--card:#14181E;--line:#2A313B;--text:#F2F4F7;--mute:#A0A9B5;--dim:#5E6672;--acc:#19F08C;--field:#0E1115;
--f:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(180deg,var(--bg2),var(--bg) 60%) fixed;color:var(--text);font-family:var(--f);font-weight:300;font-size:16px;line-height:1.6;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:0 20px calc(110px + env(safe-area-inset-bottom))}
a{color:var(--acc)}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0}
.kicker{font-size:11px;letter-spacing:.18em;color:var(--acc);font-weight:500;text-transform:uppercase;margin:26px 0 12px}
.h1{font-size:30px;margin:0 0 16px}
.h2{font-size:22px;margin:0 0 12px}
.lead{font-size:17px;font-weight:500}
.sec{font-size:11px;letter-spacing:.16em;color:var(--acc);font-weight:500;text-transform:uppercase;margin:26px 0 10px}
p{margin:0 0 14px}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.card.edge{border-left:3px solid var(--acc)}
.card .t{font-size:11px;letter-spacing:.16em;color:var(--acc);font-weight:500;text-transform:uppercase;margin-bottom:6px}
.quote{border-left:3px solid var(--acc);padding:2px 0 2px 16px;margin:18px 0;font-style:italic;font-size:18px;font-weight:300;line-height:1.5}
.quote small{display:block;font-style:normal;font-size:10px;letter-spacing:.16em;color:var(--mute);margin-top:6px;text-transform:uppercase}
.hero{position:relative;margin:0 -20px;height:min(62vh,430px);background-size:cover;background-position:center bottom}
.hero.full{height:min(78vh,560px)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:35%;background:linear-gradient(transparent,var(--bg))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:999px;background:var(--acc);color:#04120B;font:600 13px var(--f);letter-spacing:.12em;text-transform:uppercase;border:0;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.small{min-height:40px;padding:0 18px;font-size:11px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.center{text-align:center}
label.lab{display:block;font-size:13px;color:var(--mute);margin:16px 0 6px}
input[type=text],input[type=number],input[inputmode],textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--text);font:400 16px var(--f);padding:12px 14px;outline:none}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(25,240,140,.12)}
.money{display:flex;align-items:center;gap:8px}
.money span{color:var(--mute);font-size:14px}
.money input{text-align:right}
.ro{opacity:.85;border-style:dashed}
/* checkbox real e grande para toque */
label.ck{display:flex;align-items:center;gap:14px;min-height:52px;padding:6px 0;cursor:pointer;font-size:16px;font-weight:400;user-select:none}
label.ck input{position:absolute;opacity:0;width:1px;height:1px}
label.ck .box{flex:0 0 28px;width:28px;height:28px;border:2px solid var(--acc);border-radius:7px;background:var(--field);display:grid;place-items:center;transition:.15s}
label.ck .box:after{content:"";width:8px;height:15px;border:solid #04120B;border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:.15s}
label.ck input:checked + .box{background:var(--acc)}
label.ck input:checked + .box:after{transform:rotate(45deg) scale(1)}
label.ck input:focus-visible + .box{box-shadow:0 0 0 3px rgba(25,240,140,.35)}
label.ck.big{background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:12px 16px;margin:18px 0;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.segs{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin:10px 0 4px}
.segs i{height:5px;background:var(--line);border-radius:1px}.segs i.on{background:var(--acc)}
.grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.grid30 a{display:grid;place-items:center;aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:500;font-size:15px}
.grid30 a.done{background:var(--acc);color:#04120B;border-color:var(--acc);font-weight:700}
.list a{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:400}
.list a:after{content:"›";color:var(--acc);font-size:22px}
.trk{margin-bottom:18px}
.trk .g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 4px}
.trk .c{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mute)}
.trk label.ck{min-height:0;padding:0;gap:0}
.trk label.ck .box{width:34px;height:34px;flex-basis:34px}
.steps{counter-reset:s}
.steps li{list-style:none;counter-increment:s;display:flex;gap:14px;align-items:flex-start;margin:0 0 16px}
.steps li:before{content:counter(s);flex:0 0 30px;height:30px;border:1.5px solid var(--acc);color:var(--acc);border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;margin-top:2px}
.steps{padding:0;margin:0}
.qs{margin:0 0 12px;padding-left:20px;font-style:italic;color:var(--mute)}.qs li{margin:0 0 6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,11,13,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.nav .mid{font-size:11px;color:var(--dim);letter-spacing:.1em;text-align:center;flex:1}
.top{position:sticky;top:0;z-index:15;background:rgba(10,11,13,.9);backdrop-filter:blur(10px);margin:0 -20px;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.top a{color:var(--acc);text-decoration:none;font-weight:500}
.imp{min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:flex-end;text-align:center;padding-bottom:20px}
.imp .ph{font-size:22px;font-style:italic;font-weight:300;line-height:1.55;margin:10px 0 20px}
.imp .next{font-size:11px;letter-spacing:.2em;color:var(--dim)}
.imp .nm{font-size:24px;font-weight:700;color:var(--acc);margin:4px 0 22px}
.big30{font-size:72px;font-weight:700;color:var(--acc);line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--acc);color:#04120B;padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.show{opacity:1}
.warn{background:#2a1f10;border:1px solid #6b4a1a;color:#ffd9a0;border-radius:12px;padding:12px 14px;font-size:13px;margin:12px 0}
.q4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q4 textarea{min-height:150px}
.pbar{display:grid;grid-template-columns:90px 1fr 36px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
@media print{.nav,.top,.toast,.btn{display:none!important}body{background:#fff;color:#000}.card{border-color:#999;background:#fff}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast">Salvo</div>
<script>
const D = {"MODULOS": [{"n": 1, "nome": "DIAGNÓSTICO", "scene": "dawn", "fase": 1, "dias": "Dias 01 a 03", "frase": "Você não pode organizar o que ainda não enxergou.", "intro": "Antes de mudar qualquer coisa, olhe para onde você está. Sem julgamento e sem culpa: só fatos.", "simples": "Diagnóstico não é sentença: é um retrato de hoje. Ele mostra onde estão o seu tempo, o seu dinheiro e a sua energia. Quem tenta mudar sem esse retrato costuma começar pelo que é fácil de ver, e não pelo que mais importa. Nos Dias 01 a 03 você vai registrar o seu dia, dar notas às áreas da vida e separar o que drena do que fortalece a sua energia.", "exemplo": "Marina (personagem fictícia) achava que “não tinha tempo”. Ao anotar um dia inteiro, viu que boa parte da noite se perdia entre notificações e tarefas deixadas pela metade. O problema não era a falta de tempo: era a falta de visibilidade.", "aplicar": ["Anote o que faz, sem mudar nada.", "Dê notas de 0 a 10 às áreas da vida.", "Escolha uma área para melhorar primeiro."], "campos": [["Em que área da minha vida estou mais desorganizado(a)?", 44], ["O que mais me incomoda hoje?", 44], ["O que já funciona e quero manter?", 44]], "nota": "Minha organização hoje", "checks": ["Respondi com honestidade", "Escolhi uma área para melhorar primeiro", "Li minhas respostas em voz alta"], "reflexao": "Se nada mudar nos próximos 30 dias, como estarei? E se eu fizer a minha parte?", "acao": "Escreva a área escolhida em um papel e deixe-o onde você o veja todos os dias.", "fecho": "Ver com clareza já é o primeiro passo.", "ponte": "Com o retrato em mãos, falta decidir para onde ir. O próximo módulo trata de metas."}, {"n": 2, "nome": "METAS", "scene": "mountain", "fase": 1, "dias": "Dias 04 e 05", "frase": "Meta sem primeiro passo é só um desejo bem escrito.", "intro": "Uma meta clara funciona como um farol: não anda por você, mas mostra a direção.", "simples": "Uma boa meta é específica, tem prazo, tem um jeito de ser medida e começa por um passo pequeno. Quanto mais concreta, menos espaço sobra para adiar. Antes de escrever metas, vale saber o que importa para você: é o que você faz no Dia 04. No Dia 05, você transforma uma dessas prioridades em uma meta escrita.", "exemplo": "“Quero ser mais saudável” virou “caminhar 20 minutos, 4 vezes por semana, nas próximas 4 semanas”. O desejo era o mesmo, mas agora dá para saber se a meta foi cumprida.", "aplicar": ["Escolha uma prioridade.", "Escreva o resultado de forma que dê para medir e defina um prazo.", "Defina o primeiro passo e faça-o em até 24 horas."], "campos": [["Minha principal meta", 44], ["Por que ela é importante para mim?", 44], ["Primeiro passo", 26], ["Prazo", 26]], "nota": "Clareza da minha meta", "checks": ["Escrevi minha meta com clareza", "Defini um prazo realista", "Defini o primeiro passo"], "reflexao": "O que eu faria hoje se já estivesse comprometido(a) com essa meta?", "acao": "Faça o primeiro passo em até 24 horas, mesmo que seja pequeno.", "fecho": "Meta clara, caminho possível.", "ponte": "As metas dependem também do que você pensa sobre si. Por isso, o próximo módulo trata da mentalidade."}, {"n": 3, "nome": "MENTALIDADE", "scene": "mountain2", "fase": 1, "dias": "Dias 06 e 07", "frase": "A forma como você conta a sua história influencia o próximo capítulo.", "intro": "Pensamentos não são fatos, mas guiam ações. Mudar a conversa interna muda o que você tenta.", "simples": "Frases como “eu sou assim” tendem a encerrar a conversa. Trocar por “eu ainda não fiz isto” ou “estou aprendendo” abre espaço para ajustar. Isso não é positividade forçada, nem ignorar problemas reais: é descrever a situação com mais precisão para conseguir agir sobre ela. Quando um pensamento limitante aparecer, pergunte: isto é um fato ou uma interpretação?", "exemplo": "“Eu nunca termino nada” virou “eu ainda não terminei isto, e posso ajustar o tamanho”. A tarefa deixou de ser um veredito sobre a pessoa e passou a ser um problema de tamanho.", "aplicar": ["Escreva o pensamento exatamente como ele aparece.", "Procure uma situação em que ele não foi verdade.", "Reescreva-o de forma precisa e use a nova frase por alguns dias."], "campos": [["Um pensamento que me limita", 44], ["Evidência de que nem sempre é verdade", 44], ["Nova frase que vou usar", 44]], "nota": "Confiança de que consigo mudar", "checks": ["Identifiquei um pensamento limitante", "Escrevi uma frase nova", "Reli em voz alta"], "reflexao": "O que eu diria a um amigo que estivesse falando assim de si mesmo?", "acao": "Escreva a frase nova em algum lugar visível.", "fecho": "Você muda a rota quando muda o olhar.", "ponte": "Com clareza, metas e uma conversa interna mais útil, você pode organizar a rotina. É a Fase 2."}, {"n": 4, "nome": "ROTINA", "scene": "clock", "fase": 2, "dias": "Dias 08 e 09", "frase": "Uma rotina simples vale mais do que um plano perfeito.", "intro": "Rotina não prende: ela libera a cabeça para o que importa.", "simples": "Defina âncoras: ações pequenas, em horários fixos, na manhã, na tarde e na noite. Poucos pontos fixos já dão estrutura ao dia, e o restante pode continuar flexível. Uma rotina boa é a que você consegue cumprir em um dia comum e reduzir em um dia difícil. Se ela exigir um dia perfeito para funcionar, está grande demais.", "exemplo": "Bruno (personagem fictício) escolheu três âncoras: água ao acordar, três prioridades às 9h e revisão às 21h. Ele não preencheu o dia inteiro, e mesmo assim o dia passou a ter começo, meio e fim.", "aplicar": ["Escolha uma ação simples para a manhã, a tarde e a noite.", "Associe horários realistas e crie alarmes.", "Comece o dia pelas suas prioridades."], "campos": [["Minha âncora da manhã (ação e horário)", 26], ["Minha âncora da tarde (ação e horário)", 26], ["Minha âncora da noite (ação e horário)", 26], ["O que vou parar de fazer?", 44]], "nota": "Estrutura da minha rotina", "checks": ["Defini minhas 3 âncoras", "Escolhi horários realistas", "Retirei algo que atrapalha"], "reflexao": "Que parte do meu dia é puro improviso e poderia ter uma âncora?", "acao": "Coloque suas 3 âncoras como alarmes no celular.", "fecho": "Estrutura simples, mente leve.", "ponte": "Uma rotina com âncoras abre espaço para planejar. O próximo módulo mostra como."}, {"n": 5, "nome": "PLANEJAMENTO", "scene": "door", "fase": 2, "dias": "Dia 10", "frase": "Quem planeja o dia não vira refém do que aparece.", "intro": "Planejar é decidir antes, para que, na hora, você só execute.", "simples": "O plano mais curto que funciona tem três partes: até 3 prioridades por dia, uma revisão por semana e um plano B simples para os imprevistos. Para escolher prioridades, a Matriz de prioridades separa o que é importante do que é apenas urgente. Planejar não é prever tudo: é deixar folga e saber por onde recomeçar quando o dia sai do roteiro.", "exemplo": "Letícia (personagem fictícia) lista só 3 tarefas por dia. Quando termina as três, qualquer extra é bônus. A culpa por “não dar conta de tudo” diminuiu, e as tarefas importantes passaram a ser feitas primeiro.", "aplicar": ["Escolha as prioridades do dia seguinte antes de dormir.", "Use a Matriz quando tudo parecer urgente.", "Reserve 15 minutos por semana para planejar e revisar."], "campos": [["Minhas 3 prioridades da semana", 56], ["O que pode atrapalhar? Meu plano B", 44], ["Dia e hora da minha revisão semanal", 26]], "nota": "Clareza do meu planejamento", "checks": ["Defini minhas prioridades", "Pensei em possíveis obstáculos", "Agendei minha revisão"], "reflexao": "Se eu só pudesse fazer uma coisa nesta semana, qual traria mais resultado?", "acao": "Bloqueie 15 minutos na agenda para planejar e revisar a semana.", "fecho": "Planejar é cuidar do futuro com o que você pode fazer hoje.", "ponte": "Tempo organizado pede dinheiro organizado. O próximo módulo trata de finanças."}, {"n": 6, "nome": "FINANÇAS", "scene": "growth", "fase": 2, "dias": "Dias 11 a 13", "frase": "O dinheiro que você não acompanha costuma sumir sem que você perceba.", "intro": "Controle financeiro não é ganhar muito: é saber para onde vai o que você tem.", "simples": "Cada pessoa tem uma realidade, por isso não existe uma regra única. O ponto de partida é enxergar receitas, despesas e dívidas com números reais. Nas próximas páginas você aprende duas contas simples e vê exemplos para renda baixa, renda variável e dívidas. Guardar dinheiro é uma escolha sua e não é obrigatório neste método: se o resultado do mês for apertado ou negativo, o foco é ajustar, e não se culpar.", "exemplo": "Carlos (personagem fictício) ganhava o mesmo todo mês e sempre faltava no fim. Ao somar pequenos gastos que ninguém tinha planejado, encontrou R$ 280 por mês. Ele não precisou ganhar mais: precisou enxergar.", "aplicar": ["Liste o que entra e o que sai, com valores aproximados.", "Separe despesas essenciais dos demais compromissos.", "Calcule as duas contas e escolha uma decisão para o mês."], "campos": [["Minha renda mensal aproximada (R$)", 26], ["Meu maior gasto fixo (R$)", 26], ["Onde mais gasto sem perceber?", 44]], "nota": "Clareza sobre o meu dinheiro", "checks": ["Listei minhas receitas", "Listei minhas despesas principais", "Identifiquei um gasto sem planejamento"], "reflexao": "Meus gastos de hoje combinam com o que eu digo que é importante?", "acao": "Use o Planner financeiro, nas páginas seguintes, e preencha com calma.", "fecho": "Não existe regra única. Existe a sua realidade.", "ponte": "Com tempo e dinheiro à vista, a Fase 3 trata do que sustenta tudo: hábitos e disciplina."}, {"n": 7, "nome": "HÁBITOS", "scene": "stairs", "fase": 3, "dias": "Dias 15 a 18", "frase": "Pequenos passos repetidos por tempo suficiente deixam de ser pequenos.", "intro": "Hábito é o que você faz sem precisar decidir toda vez. Por isso ele é tão útil.", "simples": "Para construir um hábito: comece pequeno, ligue-o a algo que você já faz (o gatilho) e deixe o ambiente a favor. A repetição faz o resto. Não existe um número mágico de dias: o tempo varia de pessoa para pessoa e de hábito para hábito. Por isso, o foco aqui é a repetição possível, e não a perfeição.", "exemplo": "Em vez de “vou treinar todo dia”, Paulo (personagem fictício) decidiu: “depois do café, calço o tênis e caminho 5 minutos”. Ele não se cobrava resultado, só a repetição do gatilho.", "aplicar": ["Escolha um único hábito.", "Reduza-o à versão de 2 minutos.", "Defina o gatilho: “Depois de ___, eu ___”.", "Prepare o ambiente."], "campos": [["Hábito que quero construir", 26], ["Versão pequena (2 minutos)", 44], ["Gatilho: depois de ____, eu faço ____", 44], ["Onde vou deixar o lembrete?", 26]], "nota": "Firmeza do meu hábito", "checks": ["Escolhi apenas um hábito", "Defini a versão pequena", "Defini o gatilho"], "reflexao": "Qual hábito, se eu o mantivesse, deixaria os outros mais fáceis?", "acao": "Faça a versão pequena hoje, depois do seu gatilho.", "fecho": "Não precisa ser grande. Precisa ser repetido.", "ponte": "Hábitos precisam sobreviver aos dias sem vontade. É o tema do próximo módulo."}, {"n": 8, "nome": "DISCIPLINA", "scene": "city", "fase": 3, "dias": "Dia 19", "frase": "Disciplina é fazer o combinado mesmo quando a vontade foi embora.", "intro": "A motivação vai e vem. Disciplina é a decisão que permanece quando ela some.", "simples": "Disciplina não é rigidez nem sofrimento: é reduzir o atrito. Menos decisões, regras simples e o ambiente preparado antes de você precisar. Uma regra útil é o “se... então”: “se eu estiver sem vontade, então faço só a versão mínima”. Assim, a decisão já está tomada antes do momento difícil.", "exemplo": "Júlia (personagem fictícia) deixava a roupa de treino separada na véspera. Na hora, não havia o que decidir, só o que fazer. Nos dias de pouca vontade, ela vestia a roupa e caminhava 10 minutos.", "aplicar": ["Escreva o seu combinado em uma frase.", "Descubra o que costuma tirar você dele.", "Crie uma regra “se... então” para esse momento."], "campos": [["O que eu prometo a mim mesmo(a)?", 44], ["O que costuma me tirar do combinado?", 44], ["Minha regra “se... então”", 44], ["Horário fixo do meu compromisso", 26]], "nota": "Fidelidade ao meu combinado", "checks": ["Escrevi meu combinado", "Identifiquei meu maior obstáculo", "Criei uma regra simples"], "reflexao": "Que decisão posso tomar hoje para facilitar a vida do meu eu de amanhã?", "acao": "Prepare hoje o que você vai precisar amanhã.", "fecho": "Disciplina é um favor ao seu futuro.", "ponte": "Quando a disciplina falha, o que costuma aparecer é o adiamento. O próximo módulo trata dele."}, {"n": 9, "nome": "PROCRASTINAÇÃO", "scene": "desk", "fase": 3, "dias": "Dias 20 e 21", "frase": "Começar imperfeito ainda é começar.", "intro": "Adiar raramente é preguiça. Quase sempre é medo, cansaço ou uma tarefa grande demais.", "simples": "Quando a tarefa assusta, diminua-a. Escolha o menor primeiro passo possível e dê a si mesmo um prazo curto: 5 minutos, por exemplo. Começar costuma ser a parte mais difícil, e é comum continuar depois do início. Se parar aos 5 minutos, o primeiro passo já foi dado. Também ajuda dizer por que você está adiando: o motivo mostra que tipo de ajuda a tarefa pede.", "exemplo": "Ana (personagem fictícia) adiava um e-mail difícil há 11 dias. Ao decidir “escrever só a primeira frase”, terminou em 8 minutos. A tarefa era pequena: o peso estava na ideia de começar.", "aplicar": ["Nomeie o que está adiando.", "Escreva por que adia: medo, cansaço ou tamanho da tarefa.", "Faça 5 minutos com cronômetro."], "campos": [["O que estou adiando?", 44], ["Por que estou adiando?", 44], ["Qual é o menor primeiro passo?", 44], ["Quando vou começar? (dia e hora)", 26]], "nota": "Quanto avancei no que adiava", "checks": ["Identifiquei a tarefa", "Dividi a tarefa", "Defini o primeiro passo", "Comecei"], "reflexao": "Como vou me sentir ao terminar o que estou adiando?", "acao": "Ajuste um cronômetro para 5 minutos e comece agora.", "fecho": "Cinco minutos mudam o dia.", "ponte": "Você tem a base. Agora o desafio é manter o ritmo: constância."}, {"n": 10, "nome": "CONSTÂNCIA", "scene": "road", "fase": 4, "dias": "Dias 22 a 30", "frase": "Um dia ruim não apaga seu progresso.", "intro": "Constância não é nunca falhar. É voltar rápido depois de falhar.", "simples": "Quem desiste costuma tratar um tropeço como o fim. Quem continua o trata como parte do caminho e tem um plano mínimo para os dias ruins. Defina antes qual é a sua versão mínima, o que costuma tirar você do ritmo e qual é o primeiro gesto de volta. Depois de uma falha, a regra prática é fazer o mínimo no dia seguinte, em vez de esperar pela “segunda-feira ideal”.", "exemplo": "Rafael (personagem fictício) perdeu 3 dias de treino. Em vez de recomeçar “na segunda”, fez 10 minutos naquela mesma noite. A sequência continuou.", "aplicar": ["Defina sua versão mínima.", "Escreva o que costuma fazer você parar.", "Combine consigo o primeiro gesto de volta."], "campos": [["O que me faz desistir?", 44], ["O que posso fazer nos dias ruins?", 44], ["Qual é minha versão mínima?", 44]], "nota": "Minha capacidade de voltar", "checks": ["Criei meu plano de emergência", "Escolhi minha versão mínima", "Escrevi onde vou vê-la"], "reflexao": "Qual foi a última vez que voltei depois de cair? O que me ajudou?", "acao": "Escreva sua versão mínima onde você a veja todo dia.", "fecho": "Volte amanhã. Sempre volte.", "ponte": "Agora você usa tudo o que praticou para revisar, ajustar e planejar além dos 30 dias."}], "FASES": [{"n": 1, "nome": "CLAREZA E AUTOCONHECIMENTO", "curto": "Clareza", "a": 1, "b": 7, "scene": "road", "frase": "Você não precisa enxergar o caminho inteiro.\nSó precisa enxergar o próximo passo.", "desc": "Ver onde você está, o que importa e para onde quer ir.", "modulos": [1, 2, 3]}, {"n": 2, "nome": "ORGANIZAÇÃO DA ROTINA E DAS FINANÇAS", "curto": "Organização", "a": 8, "b": 14, "scene": "city", "frase": "Cada hora e cada real\nganham sentido quando têm um destino.", "desc": "Dar estrutura ao dia, ao planejamento e ao dinheiro.", "modulos": [4, 5, 6]}, {"n": 3, "nome": "DISCIPLINA, HÁBITOS E PROCRASTINAÇÃO", "curto": "Disciplina", "a": 15, "b": 21, "scene": "stairs", "frase": "Ninguém sobe a escada de uma vez.\nSubir degrau por degrau já é subir.", "desc": "Construir um hábito, sustentá-lo sem vontade e vencer o adiamento.", "modulos": [7, 8, 9]}, {"n": 4, "nome": "CONSTÂNCIA, REVISÃO E CONTINUIDADE", "curto": "Constância", "a": 22, "b": 30, "scene": "dawn", "frase": "Todo amanhecer é uma chance de recomeçar\nsem pedir desculpas.", "desc": "Manter o ritmo, revisar os resultados e planejar os próximos 30 dias.", "modulos": [10]}], "DIAS": [{"t": "Registre o seu dia como ele é", "o": "Ter um retrato honesto de como o seu tempo é usado hoje.", "e": "Antes de mudar a rotina, é preciso vê-la. Hoje você não vai corrigir nada: só anotar o que faz, em blocos de poucas horas, sem julgar. Esse registro é a base dos próximos dias.", "ex": "Marina (personagem fictícia) anotou um dia comum e viu que, entre 19h e 21h, o tempo se dividia entre redes sociais e tarefas de casa feitas pela metade. Antes, ela achava que “não tinha tempo”.", "q": ["Em que parte do dia eu mais perco o controle do meu tempo?", "O que eu faço no automático, sem decidir?"], "m": "Anote suas atividades de hoje, da manhã à noite, sem mudar nada no seu comportamento.", "p": ["Abra o bloco de notas do celular ou use papel.", "A cada 2 horas, escreva o que fez e quanto tempo levou.", "À noite, leia a lista inteira sem comentar. Só observe."], "r": [["Meu dia em blocos: manhã, tarde e noite", "m"], ["O que mais me surpreendeu", "l"]], "c": ["Anotei pelo menos 3 momentos do dia", "Reli o registro à noite", "Escrevi o que me surpreendeu"], "f": "Ver o dia como ele é já é uma forma de começar a mudá-lo.", "a": "Organizar começa por enxergar, e não por corrigir.", "n": "Amanhã você transforma este retrato em notas para as áreas da vida.", "link": null}, {"t": "Dê nota às áreas da sua vida", "o": "Medir, de 0 a 10, como estão sete áreas da sua vida hoje.", "e": "Uma nota não é um julgamento: é um ponto de partida. Ao comparar as áreas, você enxerga onde a atenção está faltando. No Dia 14 e no Dia 30 você dará novas notas e vai poder comparar.", "ex": "Carlos (personagem fictício) deu 8 para Trabalho, 3 para Finanças e 4 para Hábitos. Antes da lista, achava que “tudo estava bagunçado”. Com ela, viu que havia um ponto mais urgente que os outros.", "q": ["Qual área recebe mais da minha atenção, e qual recebe menos?", "A nota mais baixa me surpreende?"], "m": "Abra o Painel de evolução e preencha a coluna “Dia 01” das sete áreas, com notas de 0 a 10.", "p": ["Abra o Painel de evolução (botão abaixo).", "Para cada área, pergunte: como ela está hoje, de 0 a 10?", "Use números inteiros e não corrija depois.", "Observe qual área ficou com a nota mais baixa."], "r": [["Área com a nota mais baixa", "l"], ["Por que dei essa nota?", "m"]], "c": ["Preenchi as sete notas do Painel (Dia 01)", "Identifiquei a área mais baixa", "Escrevi o motivo da nota"], "f": "Uma nota baixa não diz quem você é. Diz onde dar atenção primeiro.", "a": "Comparar áreas mostra onde a atenção está faltando.", "n": "Amanhã você separa o que drena do que fortalece a sua energia.", "link": ["ABRIR O PAINEL", "painel"]}, {"t": "Separe o que drena do que fortalece", "o": "Identificar o que consome e o que devolve a sua energia.", "e": "Nem todo cansaço vem de excesso de trabalho. Algumas tarefas, hábitos e situações drenam energia; outras devolvem. Conhecer os dois lados ajuda a decidir o que reduzir e o que proteger.", "ex": "Paulo (personagem fictício) percebeu que ligações longas depois das 21h o deixavam sem sono, enquanto uma caminhada de 15 minutos o deixava mais disposto. Passou as ligações para o início da tarde.", "q": ["O que, no meu dia, me cansa sem necessidade?", "O que me dá energia e eu faço pouco?"], "m": "Liste 3 coisas que drenam e 3 que fortalecem a sua energia. Escolha uma de cada lado para agir.", "p": ["Releia o registro do Dia 01.", "Escreva 3 itens que drenam.", "Escreva 3 itens que fortalecem.", "Circule um de cada lado: reduzir um, ampliar o outro."], "r": [["3 coisas que me drenam", "m"], ["3 coisas que me fortalecem", "m"]], "c": ["Listei 3 itens que drenam", "Listei 3 itens que fortalecem", "Escolhi um para reduzir e um para ampliar"], "f": "Cuidar da própria energia não é luxo. É a base de qualquer rotina.", "a": "Energia também é um recurso, e pode ser planejada.", "n": "Amanhã você define o que realmente importa para você.", "link": null}, {"t": "Descubra o que realmente importa", "o": "Definir 3 prioridades de vida para guiar as suas escolhas nos próximos 30 dias.", "e": "Quando tudo parece importante, escolher fica pesado. Valores são aquilo que você quer proteger mesmo quando é difícil: família, saúde, estabilidade, aprendizado. Conhecer os seus facilita dizer “não” ao que só ocupa espaço.", "ex": "Letícia (personagem fictícia) escolheu três prioridades: saúde, tempo com a família e estabilidade financeira. Ao receber um convite para trabalhar aos sábados, comparou com a lista e decidiu recusar.", "q": ["Que três coisas eu não aceitaria perder?", "A minha rotina atual protege essas três coisas?"], "m": "Escolha 3 prioridades e escreva, para cada uma, uma ação concreta que a proteja nesta semana.", "p": ["Escreva 6 coisas importantes para você, sem filtrar.", "Corte até restarem 3.", "Para cada uma, escreva uma ação pequena para esta semana."], "r": [["Minhas 3 prioridades de vida", "m"], ["Uma ação para cada uma", "m"]], "c": ["Escolhi 3 prioridades", "Escrevi uma ação para cada uma", "Li tudo em voz alta"], "f": "Dizer sim ao que importa quase sempre significa dizer não a outra coisa.", "a": "Prioridades claras tornam as escolhas menos pesadas.", "n": "Amanhã você transforma uma dessas prioridades em uma meta clara.", "link": null}, {"t": "Defina uma meta clara", "o": "Escrever uma meta com resultado, prazo e primeiro passo.", "e": "Uma boa meta responde a quatro perguntas: o quê, até quando, como vou saber que cheguei lá e qual é o primeiro passo. “Ser mais organizado” é um desejo. “Revisar as contas todo domingo por 4 semanas” é uma meta.", "ex": "Paulo (fictício) trocou “quero ser mais saudável” por “caminhar 20 minutos, 4 vezes por semana, nas próximas 4 semanas”. O primeiro passo foi deixar o tênis separado na véspera.", "q": ["Se eu cumprisse esta meta, o que mudaria na minha rotina?", "Como vou saber que cheguei lá?"], "m": "Escolha uma das 3 prioridades do Dia 04 e transforme-a em uma meta escrita, com prazo realista e primeiro passo para hoje.", "p": ["Escolha UMA prioridade do Dia 04.", "Escreva o resultado de um jeito que dê para medir.", "Defina um prazo possível.", "Faça o primeiro passo hoje, por menor que seja."], "r": [["Minha meta (o quê)", "m"], ["Prazo e como vou medir", "l"], ["Primeiro passo (feito hoje)", "l"]], "c": ["Escrevi a meta com prazo", "Defini como vou medir", "Fiz o primeiro passo"], "f": "Uma meta pequena e escrita vale mais do que um sonho grande guardado.", "a": "Meta boa é específica, tem prazo e começa por um passo pequeno.", "n": "Amanhã você olha para a conversa que tem consigo, porque ela influencia as suas metas.", "link": null}, {"t": "Examine a conversa que você tem consigo", "o": "Reconhecer um pensamento que limita e reescrevê-lo de forma mais útil.", "e": "Pensamentos não são fatos, mas influenciam o que você tenta. “Eu nunca termino nada” fecha portas. “Eu ainda não terminei isto” abre uma. Reescrever não é fingir que está tudo bem: é descrever com mais precisão para poder agir.", "ex": "“Eu sou péssimo com dinheiro” virou “eu nunca anotei meus gastos; posso começar com uma semana”. A segunda frase aponta uma ação.", "q": ["Qual frase sobre mim eu repito com mais frequência?", "Que evidência mostra que ela nem sempre é verdade?"], "m": "Escreva um pensamento que limita, uma evidência contrária e uma frase nova, mais precisa e útil.", "p": ["Escreva a frase que você mais repete sobre si.", "Procure uma situação em que ela não foi verdade.", "Reescreva-a como algo que você pode ajustar.", "Leia a frase nova em voz alta."], "r": [["Pensamento que me limita", "l"], ["Evidência de que nem sempre é verdade", "m"], ["Minha frase nova", "l"]], "c": ["Escrevi o pensamento que limita", "Encontrei uma evidência contrária", "Escrevi e li a frase nova"], "f": "Você pode discordar do seu pensamento sem brigar com ele.", "a": "Um pensamento mais preciso abre espaço para agir.", "n": "Amanhã você revisa a primeira fase e escolhe o foco da próxima.", "link": null}, {"t": "Revise a Fase 1", "o": "Reunir o que você descobriu e escolher o foco da Fase 2.", "e": "Revisar não é se cobrar. Serve para ver o que funcionou, o que ficou confuso e o que ajustar. Hoje você olha para os Dias 01 a 06 e decide o que leva adiante.", "ex": "Marina (fictícia) releu os registros e viu que as notas mais baixas estavam em Finanças e Rotina. Isso a ajudou a entrar na fase seguinte com um foco claro, em vez de tentar mexer em tudo.", "q": ["Qual foi a descoberta mais útil desta semana?", "O que eu quero mudar primeiro, de verdade?"], "m": "Releia os Dias 01 a 06, marque os pontos principais e escolha 1 foco para a Fase 2.", "p": ["Releia as respostas dos Dias 01 a 06.", "Destaque o que mais chamou atenção.", "Escolha UM foco para a Fase 2: rotina, finanças ou os dois.", "Dê uma nota de 0 a 10 para como foi esta semana."], "r": [["O que descobri nesta semana", "m"], ["Meu foco da Fase 2", "l"], ["Nota para esta semana (0 a 10)", "l"]], "c": ["Reli os Dias 01 a 06", "Escolhi o meu foco da Fase 2", "Dei uma nota para a semana"], "f": "Parar para olhar também é avançar.", "a": "Revisar transforma experiência em direção.", "n": "Amanhã começa a Fase 2: você monta a estrutura do dia com âncoras.", "link": null}, {"t": "Crie as âncoras do seu dia", "o": "Definir três momentos fixos, de manhã, à tarde e à noite, que organizem o seu dia.", "e": "Âncoras são ações pequenas, feitas sempre no mesmo momento, que dão estrutura ao resto. Você não precisa preencher o dia inteiro: três pontos fixos já reduzem o improviso.", "ex": "Bruno (personagem fictício) escolheu: beber água ao acordar, escolher 3 prioridades às 9h e revisar o dia às 21h. O resto do dia continuou flexível, mas ele sempre sabia por onde começar e como terminar.", "q": ["Que parte do meu dia é puro improviso?", "Quais horários são realistas, mesmo nos dias corridos?"], "m": "Defina uma âncora para a manhã, a tarde e a noite, com horário, e crie alarmes no celular.", "p": ["Escolha uma ação simples para cada período do dia.", "Associe um horário realista a cada uma.", "Crie um alarme para cada âncora.", "Programe o primeiro alarme para amanhã."], "r": [["Âncora da manhã (ação e horário)", "l"], ["Âncora da tarde (ação e horário)", "l"], ["Âncora da noite (ação e horário)", "l"]], "c": ["Defini as três âncoras", "Escolhi horários realistas", "Criei os alarmes"], "f": "Uma rotina simples que você cumpre vale mais do que uma perfeita que você abandona.", "a": "Poucos pontos fixos já dão estrutura ao dia.", "n": "Amanhã você usa a âncora da manhã para escolher as suas prioridades.", "link": null}, {"t": "Escolha as prioridades do dia", "o": "Separar o importante do urgente e escolher até 3 prioridades.", "e": "Nem tudo o que é urgente é importante. A Matriz de prioridades divide as tarefas em quatro grupos: fazer agora, agendar, reduzir ou eliminar. Em cada dia, escolha no máximo 3 prioridades para não terminar com a sensação de ter falhado.", "ex": "Letícia (fictícia) lista só 3 tarefas por dia. Quando termina as três, qualquer extra é bônus. A culpa por “não dar conta de tudo” diminuiu.", "q": ["O que está urgente, mas não é importante?", "O que é importante e eu sempre empurro?"], "m": "Despeje as suas pendências na Matriz de prioridades e escolha até 3 prioridades para amanhã.", "p": ["Abra a Matriz de prioridades (botão abaixo).", "Escreva todas as pendências nos quadrantes.", "Escolha no máximo 3 para amanhã.", "Defina qual será a primeira."], "r": [["Minhas prioridades de amanhã", "m"], ["A primeira tarefa que vou fazer", "l"]], "c": ["Classifiquei as pendências na Matriz", "Escolhi até 3 prioridades", "Defini a primeira tarefa"], "f": "Quem escolhe o que fazer primeiro trabalha menos no escuro.", "a": "Três prioridades por dia bastam; o resto é extra.", "n": "Amanhã você leva essa lógica para a semana inteira.", "link": ["ABRIR A MATRIZ", "matriz"]}, {"t": "Planeje a sua semana", "o": "Montar a semana com prioridades por dia e margem para imprevistos.", "e": "Quinze minutos de planejamento evitam dezenas de decisões no improviso. Anote um foco para a semana, distribua as prioridades e deixe pelo menos um dia mais leve. Vencimentos de contas entram aqui depois que você os listar, no Dia 13.", "ex": "Rafael (personagem fictício) escreveu uma prioridade por dia útil e deixou quarta-feira com uma tarefa só, de propósito. Quando surgiu um imprevisto na terça, a semana não desmoronou.", "q": ["Que dia da semana costuma sair do controle?", "Onde posso deixar uma folga?"], "m": "Preencha o Planner semanal com o foco da semana e as prioridades de cada dia.", "p": ["Abra o Planner semanal (botão abaixo).", "Escreva o foco da semana.", "Distribua as prioridades pelos dias.", "Deixe pelo menos um dia mais leve."], "r": [["Foco da semana", "l"], ["Dia mais leve e por quê", "l"]], "c": ["Preenchi o foco da semana", "Distribuí as prioridades", "Deixei um dia mais leve"], "f": "Planejar a semana é cuidar do seu eu de quinta-feira.", "a": "Quinze minutos de planejamento reduzem decisões no improviso.", "n": "Amanhã você começa a olhar para o dinheiro: o que entra e o que sai.", "link": ["ABRIR O PLANNER SEMANAL", "semanal"]}, {"t": "Mapeie o que entra e o que sai", "o": "Listar receitas e despesas do mês para ver o quadro completo.", "e": "Organizar o dinheiro começa por números reais, e não por regras. Receitas são o que entra; despesas são o que sai. Hoje você preenche a primeira página do Planner financeiro com valores aproximados. Se não souber um valor, estime e marque para conferir depois.", "ex": "Carlos (fictício) somou os pequenos gastos de um mês (lanches, aplicativos, taxas) e encontrou R$ 280 que ninguém tinha planejado. Só ao somar, o valor ficou visível.", "q": ["Os meus números reais batem com a ideia que eu tinha?", "Alguma despesa me surpreendeu?"], "m": "Preencha, na página 1 do Planner financeiro, as receitas previstas e as despesas essenciais.", "p": ["Abra o Planner financeiro (botão abaixo).", "Escreva suas receitas previstas do mês.", "Preencha as despesas essenciais; use extrato ou fatura para conferir.", "Marque o que você apenas estimou."], "r": [["Total de receitas previstas (R$)", "l"], ["Total de despesas essenciais (R$)", "l"], ["Valor que mais me surpreendeu", "l"]], "c": ["Preenchi as receitas", "Preenchi as despesas essenciais", "Conferi ao menos um valor no extrato ou na fatura"], "f": "Números reais assustam menos do que aquilo que ficou sem olhar.", "a": "Antes de decidir, é preciso saber quanto entra e quanto sai.", "n": "Amanhã você completa o quadro e calcula o dinheiro disponível.", "link": ["ABRIR O PLANNER FINANCEIRO", "planner"]}, {"t": "Calcule o dinheiro disponível", "o": "Calcular o saldo do período e o dinheiro disponível para planejamento.", "e": "Usamos duas contas. Saldo do período = receitas recebidas − despesas pagas. Dinheiro disponível para planejamento = receitas previstas − despesas essenciais − demais compromissos financeiros. Se o resultado ficar negativo, é um sinal para ajustar, e não para se culpar. Veja exemplos na página de finanças do Módulo 06.", "ex": "Com receitas previstas de R$ 1.800, essenciais de R$ 1.350 e compromissos de R$ 200, o dinheiro disponível é R$ 250. Separar parte disso é opcional.", "q": ["Meu resultado ficou positivo, zero ou negativo?", "Se ficou negativo, qual despesa posso ajustar primeiro?"], "m": "Complete a página 2 do Planner financeiro e escreva o seu resultado.", "p": ["Preencha os demais compromissos (parcelas, assinaturas, lazer planejado).", "Calcule o dinheiro disponível com a fórmula.", "Calcule o saldo do período, se já houve movimentação.", "Se der negativo, marque a opção de déficit e escolha uma ação."], "r": [["Dinheiro disponível para planejamento (R$)", "l"], ["Saldo do período (R$)", "l"], ["Minha decisão para este mês", "m"]], "c": ["Calculei o dinheiro disponível", "Calculei o saldo do período", "Escolhi uma decisão para o mês"], "f": "Saber o número é o primeiro passo para decidir sem medo.", "a": "Duas contas simples mostram a sua situação do mês.", "n": "Amanhã você registra dívidas e vencimentos, se houver.", "link": ["ABRIR O PLANNER FINANCEIRO", "planner_b"]}, {"t": "Organize dívidas e vencimentos", "o": "Reunir dívidas, parcelas e datas em um só lugar.", "e": "Dívida sem nome, valor e data costuma gerar mais ansiedade do que a própria dívida. O registro mostra o que vence, em que ordem e quanto pesa. Se você não tem dívidas, use a página para listar contas fixas e as suas datas. Depois, leve os vencimentos para o Planner semanal.", "ex": "Marina (fictícia) listou 4 pendências: cartão, loja, empréstimo e uma conta de luz atrasada. Ao ver as datas lado a lado, notou que duas venciam na mesma semana e procurou o credor para combinar uma nova data para uma delas.", "q": ["Quais vencimentos se concentram na mesma semana?", "Existe algo que eu possa renegociar ou reorganizar?"], "m": "Preencha o Registro de dívidas e vencimentos com credor, valor, parcela e data.", "p": ["Abra o Registro (botão abaixo).", "Liste cada dívida ou conta com a data de vencimento.", "Veja qual vence primeiro.", "Escreva uma ação por item: pagar, renegociar ou consultar."], "r": [["Total de itens listados", "l"], ["O que vence primeiro", "l"], ["Ação para o primeiro item", "l"]], "c": ["Listei dívidas ou contas com data", "Identifiquei o que vence primeiro", "Defini uma ação"], "f": "Dívida com nome, valor e data é um problema que cabe em uma lista.", "a": "Enxergar prazos reduz o improviso financeiro.", "n": "Amanhã você revisa a Fase 2 e confere o que mudou.", "link": ["ABRIR O REGISTRO", "dividas"]}, {"t": "Revise a Fase 2", "o": "Avaliar a rotina e as finanças e dar novas notas às áreas da vida.", "e": "A Fase 2 mexeu com tempo e dinheiro. Hoje você confere o que se manteve, o que pesou e o que ajustar antes de entrar nos hábitos. Também atualiza a coluna “Dia 14” do Painel de evolução.", "ex": "Bruno (fictício) viu que cumpria duas das três âncoras. Em vez de abandonar o plano, trocou o horário da âncora da tarde, que era o que falhava.", "q": ["Quais âncoras eu cumpri na maior parte dos dias?", "Que ajuste financeiro posso manter no próximo mês?"], "m": "Releia os Dias 08 a 13, atualize o Painel (coluna “Dia 14”) e escolha um ajuste para a Fase 3.", "p": ["Releia as respostas dos Dias 08 a 13.", "Abra o Painel e dê novas notas (coluna “Dia 14”).", "Compare com as notas do Dia 01.", "Escolha um ajuste para levar adiante."], "r": [["O que funcionou na rotina", "l"], ["O que preciso ajustar nas finanças", "l"], ["Nota da semana (0 a 10)", "l"]], "c": ["Reli os Dias 08 a 13", "Atualizei o Painel (Dia 14)", "Escolhi um ajuste para a Fase 3"], "f": "Ajustar não é recuar. É aprender com o que aconteceu.", "a": "Revisar mostra o que mantém e o que muda.", "n": "Amanhã começa a Fase 3: você escolhe o hábito que vai construir.", "link": ["ABRIR O PAINEL", "painel"]}, {"t": "Escolha um hábito", "o": "Escolher o hábito que você vai construir daqui para frente.", "e": "Quem tenta mudar tudo ao mesmo tempo costuma cansar. Escolha um único hábito, simples e possível, que ajude as suas prioridades. Um bom hábito tem ação clara: “caminhar”, e não “ser mais ativo”.", "ex": "Paulo (fictício) queria “cuidar mais da saúde”. Escolheu um hábito concreto: caminhar depois do café. Ficou claro o que fazer e quando.", "q": ["Qual hábito deixaria os outros mais fáceis?", "Por que esse hábito, e por que agora?"], "m": "Escolha um único hábito e escreva-o como uma ação clara.", "p": ["Pense em 3 hábitos que ajudariam.", "Escolha o que mais facilita os outros.", "Escreva-o como uma ação (verbo + situação).", "Leia a sua escolha em voz alta."], "r": [["Meu hábito", "l"], ["Por que esse hábito, e por que agora?", "m"]], "c": ["Escolhi um único hábito", "Escrevi como ação clara", "Escrevi por que ele importa"], "f": "Escolher um hábito é escolher uma direção, e não uma obrigação.", "a": "Um hábito bem escolhido é claro, simples e possível.", "n": "Amanhã você reduz esse hábito à versão de 2 minutos.", "link": null}, {"t": "Reduza o hábito a 2 minutos", "o": "Fazer a versão mínima do hábito, tão pequena que seja difícil falhar.", "e": "A versão de 2 minutos não é o objetivo final: é a porta de entrada. Ela diminui o atrito e mostra que você consegue. Depois que o hábito entra na rotina, é possível aumentar com calma.", "ex": "“Ler todo dia” virou “ler uma página”. “Treinar” virou “colocar a roupa de treino”. Em ambos os casos, o gesto inicial era pequeno o bastante para acontecer até nos dias ruins.", "q": ["Qual é a menor versão possível desse hábito?", "O que torna essa versão fácil de cumprir?"], "m": "Defina a versão de 2 minutos do seu hábito e faça-a hoje.", "p": ["Escreva a versão de 2 minutos.", "Escolha o momento do dia para fazer.", "Faça agora, sem esperar vontade.", "Marque que cumpriu."], "r": [["Minha versão de 2 minutos", "l"], ["Quando vou fazer", "l"]], "c": ["Defini a versão de 2 minutos", "Fiz a versão mínima hoje", "Marquei no Rastreador de hábitos"], "f": "Pequeno demais para falhar é o tamanho certo para começar.", "a": "A versão mínima é a porta de entrada do hábito.", "n": "Amanhã você liga o hábito a algo que já faz todo dia.", "link": ["ABRIR O RASTREADOR", "tracker"]}, {"t": "Crie um gatilho", "o": "Ligar o hábito a algo que você já faz todos os dias.", "e": "Um gatilho é um lembrete embutido na rotina: “depois de ___, eu faço ___”. Quanto mais firme for a ação que vem antes (escovar os dentes, tomar café), mais fácil é o hábito se encaixar.", "ex": "“Depois de servir o café, eu escrevo minhas 3 prioridades.” “Depois de escovar os dentes, eu leio uma página.” O hábito passa a ter lugar fixo no dia.", "q": ["Que ação eu faço todo dia sem falhar?", "Esse gatilho é fácil de lembrar?"], "m": "Complete a frase “Depois de ___, eu vou ___” e execute hoje.", "p": ["Liste 3 ações que você faz todo dia.", "Escolha a mais firme.", "Complete a frase do gatilho.", "Execute hoje e amanhã."], "r": [["Depois de ____, eu vou ____", "l"], ["O gatilho foi fácil de lembrar? Por quê?", "l"]], "c": ["Escolhi o gatilho", "Completei a frase", "Executei hoje"], "f": "O hábito gruda no que já faz parte do seu dia.", "a": "Um bom gatilho transforma intenção em lugar fixo na rotina.", "n": "Amanhã você prepara o ambiente para facilitar o hábito.", "link": null}, {"t": "Prepare o ambiente", "o": "Facilitar o bom hábito e dificultar o que atrapalha.", "e": "O ambiente pesa mais do que a vontade. Deixar o necessário à vista torna o hábito mais fácil; afastar o que distrai torna o desvio mais difícil. Pequenos ajustes físicos valem mais do que promessas.", "ex": "Júlia (fictícia) deixou o livro sobre o travesseiro e o celular carregando fora do quarto. A leitura antes de dormir passou a acontecer sem esforço.", "q": ["O que o meu hábito precisa para acontecer?", "O que, no meu ambiente, atrapalha?"], "m": "Deixe visível e à mão tudo o que o hábito precisa, e afaste uma tentação.", "p": ["Liste o que seu hábito precisa para acontecer.", "Deixe esses itens à vista.", "Escolha uma tentação para afastar.", "Observe a diferença amanhã."], "r": [["O que vou deixar à vista", "l"], ["O que vou afastar", "l"]], "c": ["Deixei o necessário à vista", "Afastei uma tentação", "Fiz o hábito (versão mínima)"], "f": "O caminho mais fácil costuma ser o que você escolhe.", "a": "Ajustar o ambiente reduz o esforço do hábito.", "n": "Amanhã você pratica o combinado mesmo sem vontade.", "link": null}, {"t": "Cumpra o combinado sem vontade", "o": "Praticar uma ação que não depende do humor.", "e": "Disciplina aparece nos dias em que a vontade falta. A regra “se... então” deixa a decisão tomada antes: “se eu estiver sem vontade, então faço só a versão de 2 minutos”. Você não precisa gostar; precisa fazer o mínimo.", "ex": "Rafael (fictício) combinou: “se eu chegar cansado, então caminho 10 minutos”. Em um dia cansativo, ele cumpriu os 10 minutos e disse que foi mais fácil do que pensou.", "q": ["O que costuma me tirar do combinado?", "O que aconteceu quando fiz mesmo sem vontade?"], "m": "Escreva sua regra “se... então” e cumpra a versão mínima do hábito em um momento sem vontade.", "p": ["Escreva o que costuma te tirar do combinado.", "Crie a regra “se... então”.", "Em um momento sem vontade, faça só a versão mínima.", "Observe: a vontade mudou?"], "r": [["Se ____, então ____", "l"], ["O que aconteceu quando fiz sem vontade", "m"]], "c": ["Escrevi a regra “se... então”", "Fiz a versão mínima sem vontade", "Registrei o que aconteceu"], "f": "A vontade é visita. O compromisso mora aqui.", "a": "Uma regra decidida antes ajuda nos momentos difíceis.", "n": "Amanhã você enfrenta uma tarefa que vem adiando.", "link": null}, {"t": "Dê 5 minutos a uma tarefa adiada", "o": "Dar o primeiro passo em algo que você vem adiando.", "e": "Adiar costuma vir de medo, cansaço ou de uma tarefa grande demais. Diminuir a tarefa e usar um cronômetro curto reduz a resistência. Se parar após 5 minutos, o passo já foi dado.", "ex": "Ana (fictícia) adiava um e-mail difícil há 11 dias. Decidiu escrever só a primeira frase e terminou em 8 minutos.", "q": ["Por que estou adiando isto: medo, cansaço ou tamanho?", "Como a tarefa estava na minha cabeça e como ficou depois?"], "m": "Escolha uma tarefa adiada, ajuste um cronômetro para 5 minutos e comece.", "p": ["Escolha a tarefa.", "Escreva por que está adiando.", "Ajuste o cronômetro para 5 minutos.", "Comece. Ao fim, decida se para ou continua."], "r": [["Tarefa que vinha adiando", "l"], ["Por que eu adiava", "l"], ["O que senti depois dos 5 minutos", "l"]], "c": ["Escolhi a tarefa", "Fiz os 5 minutos", "Registrei o que senti"], "f": "Quanto mais você adia, mais ela pesa. Começar alivia.", "a": "O menor primeiro passo costuma destravar o resto.", "n": "Amanhã você revisa a Fase 3 e confere o seu rastreador.", "link": null}, {"t": "Revise a Fase 3", "o": "Avaliar o hábito, a disciplina e o adiamento na reta final do desafio.", "e": "Hoje você olha o Rastreador de hábitos e os Dias 15 a 20 para ver o que se manteve e o que pesou. Não é para somar culpa: é para escolher o ajuste que torna a Fase 4 mais leve.", "ex": "Paulo (fictício) cumpriu a versão de 2 minutos em 11 dos 14 dias que marcou. Em vez de focar nas falhas, percebeu que as falhas ocorriam às sextas e mudou o horário.", "q": ["Quantos dias eu marquei e o que atrapalhou nos outros?", "Qual ajuste torna o hábito mais fácil?"], "m": "Conte os dias marcados no Rastreador, avalie a fase e escolha um ajuste.", "p": ["Abra o Rastreador de hábitos.", "Conte os dias marcados.", "Identifique o que ajudou e o que atrapalhou.", "Escolha um ajuste para a Fase 4."], "r": [["Dias marcados no hábito", "l"], ["O que ajudou", "l"], ["Ajuste que vou fazer", "l"]], "c": ["Contei os dias marcados no Rastreador", "Identifiquei o que ajudou e atrapalhou", "Escolhi um ajuste para a Fase 4"], "f": "O que você acompanha, você consegue manter.", "a": "Contar os dias mostra o que é real, e não o que parece.", "n": "Amanhã começa a Fase 4: você prepara um plano para os dias ruins.", "link": ["ABRIR O RASTREADOR", "tracker"]}, {"t": "Prepare o plano para dias ruins", "o": "Definir o mínimo que você faz mesmo nos piores dias.", "e": "Dias ruins vão acontecer. Quem tem um plano mínimo volta mais rápido. A versão mínima são 3 ações pequenas que você consegue cumprir exausto(a). Elas mantêm a sequência viva.", "ex": "Rafael (fictício) escreveu: “beber água, caminhar 5 minutos e anotar uma frase no fim do dia”. No dia mais difícil do mês, fez só isso e considerou o dia cumprido.", "q": ["O que eu faço mesmo nos meus piores dias?", "Consigo cumprir isto estando exausto(a)?"], "m": "Preencha a página “Plano para dias ruins” com 3 ações mínimas.", "p": ["Abra o Plano para dias ruins (botão abaixo).", "Escolha 3 ações muito pequenas.", "Reduza até serem fáceis.", "Deixe a página onde você a veja."], "r": [["Minha ação mínima mais importante", "l"], ["Onde vou deixar este plano à vista", "l"]], "c": ["Escrevi 3 ações mínimas", "Reduzi até ficar fácil", "Defini onde vou deixar o plano"], "f": "O mínimo constante vence o máximo ocasional.", "a": "Um plano mínimo mantém a sequência viva nos dias ruins.", "n": "Amanhã você identifica o que mais te faz abandonar.", "link": ["ABRIR O PLANO", "ruins"]}, {"t": "Identifique o seu maior sabotador", "o": "Descobrir o que mais atrapalha você e preparar uma resposta.", "e": "Quase todo mundo tem um sabotador principal: cansaço, dúvida, distração, perfeccionismo, medo de errar. Dar nome a ele ajuda a reconhecê-lo na hora em que aparece e a ter uma resposta pronta.", "ex": "Ana (fictícia) percebeu que o perfeccionismo era o seu sabotador: ela só começava quando tinha certeza. A resposta que escreveu foi: “Primeiro rascunho. Pode ser ruim.”", "q": ["Quando esse sabotador aparece e o que ele me diz?", "Que resposta curta eu posso ter pronta?"], "m": "Nomeie o seu maior sabotador e escreva uma resposta curta para ele.", "p": ["Releia os dias anteriores e procure padrões.", "Dê um nome ao sabotador principal.", "Escreva o que ele costuma dizer.", "Escreva uma resposta curta e prática."], "r": [["Meu maior sabotador", "l"], ["O que ele diz", "l"], ["Minha resposta", "l"]], "c": ["Nomeei o sabotador", "Escrevi o que ele diz", "Escrevi minha resposta"], "f": "Conhecer o obstáculo é meio caminho para contorná-lo.", "a": "Dar nome ao obstáculo ajuda a reco oridade financeira e o que vai parar de fazer. Menos itens aumentam a chance de cumprir.", "ex": "Letícia (fictícia) escreveu para o ciclo seguinte: manter a revisão semanal, começar uma caminhada de 10 minutos e parar de checar o celular na cama.", "q": ["O que eu quero continuar?", "O que eu quero começar e o que vou parar de fazer?"], "m": "Preencha a página “Próximo ciclo”.", "p": ["Abra a página Próximo ciclo (botão abaixo).", "Escolha 3 objetivos.", "Escolha 3 hábitos (comece por 1 se preferir).", "Escreva 1 prioridade financeira e o que vai parar de fazer."], "r": [["O objetivo mais importante do próximo ciclo", "l"], ["O que vou parar de fazer", "l"]], "c": ["Escolhi meus objetivos", "Escolhi meus hábitos", "Defini uma prioridade financeira"], "f": "Terminar bem é começar o próximo ciclo com clareza.", "a": "Poucas escolhas bem feitas sustentam o ciclo seguinte.", "n": "Amanhã é o último dia: você compara quem era com quem é hoje.", "link": ["ABRIR O PRÓXIMO CICLO", "ciclo"]}, {"t": "Compare o antes e o depois", "o": "Rever os resultados, comparar o Dia 01 com o Dia 30 e consolidar o plano de continuidade.", "e": "Hoje você olha para trás: o Painel de evolução (notas dos Dias 01, 14 e 30), as respostas do Dia 01, o hábito, as finanças. A comparação não precisa ser dramática. Vale o que mudou, mesmo se for pouco. O plano de continuidade é o do Dia 29.", "ex": "Marina (fictícia) comparou as notas: Finanças subiu de 3 para 5 e Rotina de 4 para 6. Disse que o mais importante era saber exatamente onde tinha avançado.", "q": ["Qual é a principal diferença entre como eu estava no Dia 01 e como estou hoje?", "O que fez essa diferença acontecer?"], "m": "Atualize a coluna “Dia 30” do Painel, preencha a Revisão final e conclua o projeto.", "p": ["Abra o Painel de evolução e dê as notas do Dia 30.", "Compare com as colunas do Dia 01 e do Dia 14.", "Abra a Revisão final e responda às perguntas.", "Marque o projeto como concluído."], "r": [["A principal diferença entre o  médica ou psicológica profissional. As avaliações são autoavaliações, não testes científicos. Os personagens dos exemplos são fictícios."}, "FIN_FORMULAS": [["SALDO DO PERÍODO", "receitas recebidas − despesas pagas", "Mostra o que de fato aconteceu: o que já entrou menos o que já saiu no período que você escolheu (por exemplo, o mês até hoje)."], ["DINHEIRO DISPONÍVEL PARA PLANEJAMENTO", "receitas previstas − despesas essenciais − demais compromissos financeiros", "Mostra o que sobra, em teoria, depois de cobrir o essencial e o que você já assumiu. É a base para decidir o mês."]], "FIN_DEFS": [["Despesas essenciais", "moradia, alimentação básica, contas básicas (luz, água, internet), transporte necessário, saúde. Você define o que é essencial para a sua vida."], ["Demais compromissos financeiros", "parcelas de dívidas, financiamentos, cartão, assinaturas e qualquer valor que você já assumiu e não é essencial."]], "FIN_CASOS": [["RENDA BAIXA", "Receitas previstas: R$ 1.800 · essenciais: R$ 1.350 · compromissos: R$ 200.", "1.800 − 1.350 − 200 = R$ 250 disponíveis. Esse valor é seu para decidir. Separar uma parte é opcional, e qualquer valor serve, mesmo pequeno. Se o mês estiver apertado, não separar também é uma decisão legítima."], ["RENDA VARIÁVEL", "Últimos três meses: R$ 1.500, R$ 2.600 e R$ 1.900. Essenciais: R$ 1.200 · compromissos: R$ 150.", "Planeje pelo mês mais baixo recente (R$ 1.500): 1.500 − 1.200 − 150 = R$ 150. O que vier acima disso em um mês melhor é extra, e vale decidir antes para onde ele vai (por exemplo, cobrir um mês mais fraco ou antecipar uma parcela)."], ["COM DÍVIDAS", "Receitas previstas: R$ 2.400 · essenciais: R$ 1.500 · parcelas de dívidas: R$ 700.", "2.400 − 1.500 − 700 = R$ 200. Registre cada dívida (credor, valor, parcela, data) e verifique se vale renegociar prazos ou parcelas diretamente com o credor ou por canais oficiais de defesa do consumidor."]], "FIN_DEFICIT": ["Confira os números: um valor esquecido ou estimado demais pode mudar o resultado.", "Separe o que é essencial do que pode ser reduzido, adiado ou pausado.", "Veja o que pode ser negociado: datas de vencimento, parcelas, assinaturas.", "Pense em formas de aumentar a receita, mesmo que pequenas ou temporárias.", "Evite assumir uma nova dívida para cobrir a anterior sem antes calcular o efeito."], "FIN_DEFICIT_EX": "Exemplo: receitas previstas R$ 1.600 − essenciais R$ 1.500 − compromissos R$ 250 = −R$ 150 (déficit de R$ 150). Nesse caso, o plano do mês é fechar esses R$ 150 por redução, negociação ou receita extra.", "FIN_AVISO": "Este conteúdo é educativo e não substitui orientação financeira profissional. O e-book não recomenda produtos de investimento.", "BANCO": {"DISCIPLINA": ["Disciplina é um recado do seu eu de hoje para o seu eu de amanhã.", "Quem espera a vontade para começar costuma esperar muito.", "Faça o combinado, mesmo quando o humor discorda.", "Disciplina não é força. É preparação.", "O que você repete em silêncio constrói o que aparece em público.", "Regras simples vencem promessas grandiosas.", "Você não precisa de mais vontade. Precisa de menos desculpas elegantes.", "A disciplina de hoje é a liberdade de depois.", "Cumprir o mínimo todo dia ensina mais do que o máximo uma vez.", "Autocontrole é escolher o que você quer mais, não o que você quer agora."], "CONSTÂNCIA": ["Um dia ruim não apaga seu progresso.", "Constância é voltar, não nunca sair.", "O que importa não é a velocidade, é a sequência.", "A grande mudança costuma vestir roupa de dia comum.", "Quem aparece todo dia vence quem aparece só quando está inspirado.", "Falhou um dia? Faça o mínimo no seguinte e a sequência continua.", "Progresso parece lento até você olhar para trás.", "Seja a pessoa que continua, não a que começa melhor.", "Pequeno hoje, pequeno amanhã, notável no fim do mês.", "Constância é um acordo silencioso com você mesmo."], "FINANÇAS": ["Quem não decide para onde vai o dinheiro, descobre depois que ele já foi.", "Controlar não é privar. É escolher.", "Gastar com consciência é diferente de gastar com culpa.", "O gasto pequeno que se repete merece o mesmo respeito que o grande.", "Um número real, mesmo ruim, ajuda mais do que um número imaginado.", "Você não precisa ganhar mais para começar a organizar melhor.", "Anotar é enxergar. Enxergar é poder decidir.", "Dívida pesa menos quando ganha nome, valor e data.", "Dinheiro com destino é decisão sua, não acaso.", "O melhor momento para olhar suas contas é antes de elas olharem para você."], "PROCRASTINAÇÃO": ["Começar imperfeito ainda é começar.", "A tarefa adiada pesa mais do que a tarefa feita.", "Cinco minutos de verdade valem mais do que uma hora de planejamento.", "Você não precisa terminar hoje. Só precisa começar hoje.", "Esperar o momento perfeito costuma ser só outro jeito de adiar.", "O medo de fazer mal feito costuma ser maior do que o trabalho em si.", "Quando a tarefa assusta, diminua-a.", "O primeiro passo é pequeno de propósito.", "Adiar não elimina a tarefa. Só muda o dia em que ela vai pesar.", "O alívio mora do outro lado do começo."], "FOCO": ["Foco é a arte de dizer não a coisas boas.", "Onde a atenção vai, o tempo vai junto.", "Uma coisa por vez, feita direito, vale por três feitas pela metade.", "Seu celular é uma ferramenta, não um chefe.", "Silêncio é um recurso. Proteja-o.", "Atenção dividida rende menos do que parece.", "Escolher o que ignorar é parte de escolher o que importa.", "Quem tem tudo como prioridade não tem prioridade nenhuma.", "Terminar uma coisa é melhor do que começar dez.", "Profundidade bate pressa."], "RECOMEÇO": ["Recomeçar não é voltar ao zero. É voltar com experiência.", "Todo amanhã é uma folha em branco com o que você já aprendeu.", "Você não perdeu tempo. Aprendeu o que não funciona.", "Cair faz parte. Ficar no chão é opção.", "Recomeço não precisa de data especial. Pode ser hoje, agora.", "Quem recomeça já venceu a parte mais difícil: decidir de novo.", "Não tenha vergonha de voltar. Tenha orgulho const $ = (s, r = document) => r.querySelector(s);

function finCalc() {
  if (!$('#fin_saldo')) return;
  const g = k => num(S[k]);
  const sum = ks => ks.reduce((a, k) => a + g('FIN_' + k), 0);
  const prev = sum(['REC_FONTE1', 'REC_FONTE2', 'REC_OUTRAS']);
  const ess = sum(['ESS_MORADIA', 'ESS_ALIMENTACAO', 'ESS_CONTAS', 'ESS_TRANSPORTE', 'ESS_SAUDE', 'ESS_OUTRAS']);
  const comp = sum(['COMP_PARCELAS', 'COMP_FINANC', 'COMP_ASSIN', 'COMP_LAZER']);
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.value = v ? String(v.toFixed(2)).replace('.', ',') : ''; S[id] = e ? e.value : ''; };
  set('FIN_REC_PREVISTAS', prev); set('FIN_ESS_TOTAL', ess); set('FIN_COMP_TOTAL', comp);
  const saldo = g('FIN_REC_RECEBIDAS') - g('FIN_DESP_PAGAS'), disp = prev - ess - comp;
  S.FIN_SALDO = saldo ? String(saldo.toFixed(2)).replace('.', ',') : ''; S.FIN_DISPONIVEL = disp ? String(disp.toFixed(2)).replace('.', ',') : '';
  $('#fin_saldo').textContent = brl(saldo); $('#fin_disp').textContent = brl(disp);
  $('#fin_saldo').style.color = saldo < 0 ? '#ff7b7b' : 'var(--acc)'; $('#fin_disp').style.color = disp < 0 ? '#ff7b7b' : 'var(--acc)';
  $('#fin_alert').style.display = (disp < 0 || saldo < 0) ? 'block' : 'none';
}

    ${ck('CICLO_CHECK', 'Defini meu plano dos próximos 30 dias')}`, { idx: 1 });
}

function extras() {
  add('extras', 'Planners e extras', () => `
    <div class="kicker">Planners e extras</div><h1 class="h1">Ferramentas para usar quando quiser.</h1>
    <div class="list"><a href="#/ex_diag">Diagnóstico inicial</a><a href="#/semanal">Planner semanal</a><a href="#/planner">Planner financeiro mensal</a><a href="#/ex_tab">Tabela de receitas e despesas</a><a href="#/dividas">Registro de dívidas e vencimentos</a><a href="#/rastreador">Rastreador de hábitos</a><a href="#/ex_metas">Quadro de metas</a><a href="#/ex_rev">Revisão de progresso</a><a href="#/ciclo">Planejamento dos próximos 30 dias</a><a href="#/matriz">Matriz de prioridades</a><a href="#/recomeco">Plano de recomeço</a><a href="#/ruins">Plano para dias ruins</a></div>`, { idx: 1 });
  add('semanal', 'Planner semanal', () => `
    <div class="kicker">Planner semanal</div><h1 class="h1">Minha semana.</h1>${tx('SEM_FOCO', 'Foco da semana')}
    ${['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'].map((d, i) => `<div class="card"><div class="t">${d}</div>${ta('SEM_' + (i + 1) + '_PRIORIDADES', 'Prioridades', 2)}${ck('SEM_' + (i + 1) + '_CONCLUIDO', 'Dia concluído')}</div>`).join('')}`, { idx: 1 });
  add('matriz', 'Matriz de prioridades', () => `
    <div class="kicker">Matriz de prioridades</div><h1 class="h1">O que é importante e o que é só urgente.</h1>
    <p class="mute">Liste suas tarefas e distribua nos quadrantes. Depois escolha o que faz primeiro.</p>
    <div class="q4">${[['FAZER AGORA', 'Importante e urgente'], ['AGENDAR', 'Importante, não urgente'], ['REDUZIR / DELEGAR', 'Urgente, não importante'], ['ELIMINAR', 'Nem urgente, nem importante']].map(([t, s], i) => `<div class="card ${i == 0 ? 'edge' : ''}" style="padding:12px"><div class="t" style="font-size:10px">${t}</div><div class="mute" style="font-size:11px;margin-bottom:6px">${s}</div><textarea data-k="MATRIZ_Q${i + 1}" aria-label="${t}">${esc(S['MATRIZ_Q' + (i + 1)] || '')}</textarea></div>`).join('')}</div>
    ${tx('MATRIZ_PRIMEIRA', 'A primeira tarefa que vou fazer')}${ck('MATRIZ_CHECK', 'Classifiquei minhas tarefas')}`, { idx: 1 });
  add('recomeco', 'Plano de recomeço', () => `
    <div class="kicker">Plano de recomeço</div><h1 class="h1">Voltar também é avançar.</h1>
    ${[['O que eu parei de fazer?', 3], ['Por que eu parei?', 3], ['O que aprendi com isso?', 3], ['Minha versão mínima para voltar', 3]].map(([l, r], i) => ta('RECOM_CAMPO_0' + (i + 1), l, r)).join('')}
    ${tx('RECOM_CAMPO_05', 'Primeiro passo (hoje)')}${tx('RECOM_CAMPO_06', 'Quando recomeço? (dia e hora)')}
    ${sec('Checklist')}${['Aceitei que parar faz parte', 'Defini minha versão mínima', 'Dei o primeiro passo'].map((c, i) => ck('RECOM_CHECK_0' + (i + 1), c)).join('')}
    ${quote('Recomeçar não é voltar ao zero.<br>É voltar com experiência.')}`, { idx: 1 });
  add('ex_diag', 'Diagnóstico inicial', () => `
    <div class="kicker">Diagnóstico inicial</div><h1 class="h1">Onde estou hoje.</h1>
    <p class="mute">Dê uma nota de 0 a 10 para cada área, sem se comparar com ninguém. Refaça em 30 dias para comparar.</p>
    ${D.AREAS.map(a => tx('DIAG_NOTA_' + a.slice(0, 4), cap(a))).join('')}
    ${ta('DIAG_Q1', 'Qual área vou melhorar primeiro?', 3)}${ta('DIAG_Q2', 'O que já funciona e quero manter?', 3)}${ta('DIAG_Q3', 'O que mais me incomoda hoje?', 3)}`);
  const tab = (tipo, nome, verbo) => `<div class="kicker">Tabela de ${nome.toLowerCase()}</div><h1 class="h1">${nome} do mês.</h1><p class="mute">Uma linha por item, com valor e data. Marque quando for ${verbo}.</p>
    ${Array.from({ length: 14 }, (_, i) => i + 1).map(n => `<div class="card" style="padding:12px 14px">${tx(`TAB_${tipo}_${p2(n)}_DESC`, `${nome} ${n}`)}<div class="row" style="gap:8px;align-items:flex-end"><div style="flex:1;min-width:100px">${tx(`TAB_${tipo}_${p2(n)}_VALOR`, 'Valor (R$)')}</div><div style="flex:1;min-width:90px">${tx(`TAB_${tipo}_${p2(n)}_DATA`, 'Data')}</div></div>${ck(`TAB_${tipo}_${p2(n)}_OK`, verbo[0].toUpperCase() + verbo.slice(1))}</div>`).join('')}
    ${tx(`TAB_${tipo}_TOTAL`, 'Total')}`;
  add('ex_tab', 'Tabela de receitas e despesas', () => tab('REC', 'Receitas', 'recebido') + '<div style="height:30px"></div>' + tab('DESP', 'Despesas', 'pago'));
  add('ex_metas', 'Quadro de metas', () => `<div class="kicker">Quadro de metas</div><h1 class="h1">Até 3 metas, com passo e prazo.</h1>
    ${[1, 2, 3].map(n => `<div class="card ${n == 1 ? 'edge' : ''}"><div class="t">Meta ${n}</div>${tx(`META_${n}_META`, 'O quê (resultado mensurável)')}${tx(`META_${n}_PORQUE`, 'Por que importa')}${tx(`META_${n}_PASSO`, 'Primeiro passo')}<div class="row" style="gap:8px"><div style="flex:1">${tx(`META_${n}_PRAZO`, 'Prazo')}</div><div style="flex:1">${tx(`META_${n}_ANDAMENTO`, 'Andamento (%)')}</div></div>${ck(`META_${n}_CONCLUIDA`, 'Meta concluída')}</div>`).join('')}`);
  add('ex_rev', 'Revisão de progresso', () => `<div class="kicker">Revisão de progresso</div><h1 class="h1">Uma revisão por semana.</h1><p class="mute">Reserve 10 minutos. Sem cobrança: o objetivo é ajustar.</p>
    ${[1, 2, 3, 4].map(s => `<div class="card ${s == 1 ? 'edge' : ''}"><div class="t">Semana ${s}</div>${ta(`REV_S${s}_FEITO`, 'O que eu fiz', 3)}${ta(`REV_S${s}_FUNCIONOU`, 'O que funcionou', 2)}${ta(`REV_S${s}_AJUSTAR`, 'O que vou ajustar', 2)}${tx(`REV_S${s}_NOTA`, 'Nota da semana (0 a 10)')}${ck(`REV_S${s}_CHECK`, 'Semana revisada')}</div>`).join('')}`);
}

function frases() {
  add('frases', 'Banco de frases', () => `
    <div class="kicker">Banco de frases</div><h1 class="h1">60 frases originais.</h1>
    ${Object.entries(D.BANCO).map(([c, l]) => `<div class="sec">${c}</div>${l.map(t => `<p style="margin-bottom:10px">${t}</p>`).join('')}`).join('')}`, { idx: 1 });
  add('citacoes', 'Citações verificáveis', () => `
    <div class="kicker">Citações verificáveis</div><h1 class="h1">Vozes que vale ouvir.</h1>
    <p class="mute">Poucas citações, apenas com autoria e fonte conhecidas (traduções livres). As demais frases do material são reflexões originais.</p>
    ${D.CITACOES.map(([q, a, ctx]) => `<div class="card edge"><div style="font-style:italic;font-size:17px">“${q}”</div><div style="margin-top:10px;font-size:11px;letter-spacing:.14em;color:var(--acc);font-weight:500">— ${a.toUpperCase()}</div><div class="mute" style="font-size:12px">${ctx}</div></div>`).join('')}`);
  add('baixar', 'Baixar PDFs e backup', () => `
    <div class="kicker">Material</div><h1 class="h1">Baixar PDFs e backup.</h1>
    ${sec('PDFs')}<div class="list">${[['PROJETO_30_DIAS_EBOOK_FINAL', 'E-book final (leitura)'], ['PROJETO_30_DIAS_INTERATIVO', 'Projeto 30 Dias (PDF interativo)'], ['PROJETO_30_DIAS_IMPRESSAO', 'Versão para impressão'], ['PROJETO_30_DIAS_PLANNERS_EXTRAS', 'Planners e extras (PDF interativo)']].map(([f, t]) => `<a href="pdf/${f}.pdf" download>${t}</a>`).join('')}</div>
    <p class="mute" style="font-size:13px;margin-top:10px">Para usar as caixas de marcar dos PDFs interativos, abra em um leitor compatível com formulários, como o Adobe Acrobat Reader. Aqui no site tudo funciona direto no navegador.</p>
    ${sec('Backup dos seus dados')}
    <p class="mute">Seus dados ficam só neste aparelho e neste navegador. Salve um backup para guardar ou levar para outro aparelho.</p>
    <div class="row"><button class="btn small" id="bk">Salvar backup</button><label class="btn small ghost" style="cursor:pointer">Restaurar<input type="file" id="rs" accept="application/json" hidden></label><button class="btn small ghost" id="clr">Apagar tudo</button></div>
    ${storageOK ? '' : '<div class="warn">Este navegador não permite salvar dados (modo privado?). Abra o site em uma aba normal.</div>'}`, { after: backupInit });
}
function backupInit() {
  $('#bk').onclick = () => { const b = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'projeto30dias-backup.json'; a.click(); };
  $('#rs').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const o = JSON.parse(t); Object.keys(S).forEach(k => delete S[k]); Object.assign(S, o); save(); alert('Backup restaurado.'); render(); } catch (x) { alert('Arquivo inválido.'); } }); };
  $('#clr').onclick = () => { if (confirm('Apagar todas as suas marcações e respostas deste aparelho?')) { Object.keys(S).forEach(k => delete S[k]); save(); render(); } };
}

// ---------- montagem da sequência (mesma ordem do PDF)
(function () {
  const main = ['home', 'comecar', 'desafio'];
  desafio(); fin(); planner(); dividas(); ruins(); tracker(); painel(); finalPg(); ciclo(); extras(); frases();
  D.FASES.forEach(fs => {
    faseImp(fs); main.push('i/fase' + fs.n);
    fs.modulos.forEach(mn => {
      modulo(D.MODULOS.find(m => m.n === mn)); main.push('m/' + mn);
      if (mn === 5) main.push('matriz', 'semanal');
      if (mn === 6) main.push('fin', 'planner', 'dividas');
      if (mn === 7) main.push('rastreador');
      if (mn === 10) main.push('ruins', 'recomeco');
    });
    for (let d = fs.a; d <= fs.b; d++) { dia(d); main.push('d/' + d); }
  });
  main.push('painel', 'i/final', 'final', 'ciclo', 'extras', 'frases', 'citacoes');
  R.main = main;
  const order = ['comecar', 'desafio'];
  D.FASES.forEach(fs => { order.push('m/' + fs.modulos[0]); });
  // índice: ordem lógica
  const idxOrder = ['comecar', 'desafio', ...D.MODULOS.map(m => 'm/' + m.n), 'fin', 'planner', 'dividas', 'matriz', 'semanal', 'rastreador', 'ruins', 'recomeco', 'painel', 'final', 'ciclo', 'extras', 'frases', 'baixar'];
  R.forEach(r => { r.idx = 0; });
  const idxList = idxOrder.map(id => R.find(r => r.id === id)).filter(Boolean);
  idxList.forEach(r => { r.idx = 1; });
  const ix = R.find(r => r.id === 'indice'); ix.render = () => `<div class="kicker">Navegue</div><h1 class="h1">Índice</h1><div class="list">${idxList.map(r => `<a href="#/${r.id}">${r.title}</a>`).join('')}</div>`;
})();

// ---------- roteador
function route() { const h = location.hash.replace(/^#\//, ''); return h || 'home'; }
function render() {
  const id = route(), pg = R.find(r => r.id === id) || R[0];
  const i = R.main.indexOf(pg.id);
  let nav = '';
  if (!pg.nonav) {
    const prev = i > 0 ? R.main[i - 1] : 'home', next = i >= 0 && i < R.main.length - 1 ? R.main[i + 1] : null;
    const nextT = next ? (R.find(r => r.id === next).imp ? 'Continuar' : 'Próximo') : '';
    nav = `<div class="nav"><div class="in"><a class="btn small ghost" href="#/${prev}">Voltar</a><span class="mid">${i > 0 ? i + 1 + '/' + R.main.length : ''}</span>${next ? `<a class="btn small" href="#/${next}">${nextT} →</a>` : `<a class="btn small" href="#/home">Início</a>`}</div></div>`;
  }
  const top = pg.imp || pg.id === 'home' ? '' : `<div class="top"><a href="#/home">Início</a><span>Projeto 30 Dias</span><a href="#/indice">Índice</a></div>`;
  $('#app').innerHTML = top + pg.render() + nav;
  window.scrollTo(0, 0); document.title = (pg.title ? pg.title + ' · ' : '') + 'Projeto 30 Dias';
  if (pg.after) pg.after();
  if (pg.id === 'planner') finCalc();
}
window.addEventListener('hashchange', render);

// ---------- persistência (delegada: funciona para qualquer campo com data-k)
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  if (e.target.type === 'checkbox') { S[k] = e.target.checked ? 1 : 0; save(); refreshLive(k); }
});
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset && t.dataset.k; if (!k || t.type === 'checkbox') return;
  S[k] = t.value; clearTimeout(t._s); t._s = setTimeout(save, 400);
  if (k.startsWith('FIN_')) finCalc();
  if (t.dataset.pbin) { const b = document.querySelector(`[data-pb="${k}"]`); if (b) b.style.width = Math.max(0, Math.min(10, num(t.value))) * 10 + '%'; }
});
function refreshLive(k) {
  if (/^D\d\d_MISSAO/.test(k)) { const n = daysDone(); document.querySelectorAll('.segs i').forEach((s, i) => s.classList.toggle('on', i < n)); }
  const m = /^HABITO_([A-Z]+)_D/.exec(k);
  if (m) { const c = Array.from({ length: 30 }, (_, i) => S[`HABITO_${m[1]}_D${p2(i + 1)}`] ? 1 : 0).reduce((a, b) => a + b, 0); const e = document.querySelector(`[data-cnt="${m[1]}"]`); if (e) e.textContent = c + '/30'; }
}
window.addEventListener('pagehide', () => { try { if (storageOK) localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } });
render();
</script>
